<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tic-Tac-Toe</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .game {
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        #status {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .board {
            display: grid;

            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);

            gap: 5px;
        }

        .cell {
            width: 100px;
            height: 100px;

            background: white;
            border: 2px solid #333;

            font-size: 40px;
            font-weight: bold;

            cursor: pointer;
        }

        .cell:hover {
            background: #eeeeee;
        }

        #restart {
            margin-top: 25px;

            padding: 12px 25px;

            border: none;
            border-radius: 6px;

            background: #333;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

    </style>

</head>


<body>

<div class="game">

    <h1>Tic-Tac-Toe</h1>

    <p id="status">Player X's turn</p>


    <div class="board">

        <button class="cell" onclick="play(0)"></button>
        <button class="cell" onclick="play(1)"></button>
        <button class="cell" onclick="play(2)"></button>

        <button class="cell" onclick="play(3)"></button>
        <button class="cell" onclick="play(4)"></button>
        <button class="cell" onclick="play(5)"></button>

        <button class="cell" onclick="play(6)"></button>
        <button class="cell" onclick="play(7)"></button>
        <button class="cell" onclick="play(8)"></button>

    </div>


    <button id="restart" onclick="restartGame()">
        Restart Game
    </button>

</div>


<script>

    let board = [
        "", "", "",
        "", "", "",
        "", "", ""
    ];

    let currentPlayer = "X";

    let gameRunning = true;


    const winningCombinations = [

        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],

        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],

        [0, 4, 8],
        [2, 4, 6]

    ];


    function play(position) {

        if (!gameRunning) {
            return;
        }

        if (board[position] !== "") {
            return;
        }


        board[position] = currentPlayer;


        document.querySelectorAll(".cell")[position]
            .textContent = currentPlayer;


        checkGame();

    }


    function checkGame() {

        for (let combination of winningCombinations) {

            let a = combination[0];
            let b = combination[1];
            let c = combination[2];


            if (
                board[a] !== "" &&
                board[a] === board[b] &&
                board[a] === board[c]
            ) {

                document.getElementById("status")
                    .textContent =
                    "🎉 Player " + currentPlayer + " wins!";

                gameRunning = false;

                return;
            }

        }


        // Check whether all 9 cells are filled

        let full = true;

        for (let i = 0; i < 9; i++) {

            if (board[i] === "") {

                full = false;

                break;
            }

        }


        if (full) {

            document.getElementById("status")
                .textContent = "🤝 It's a draw!";

            gameRunning = false;

            return;
        }


        // Change player

        if (currentPlayer === "X") {

            currentPlayer = "O";

        } else {

            currentPlayer = "X";

        }


        document.getElementById("status")
            .textContent =
            "Player " + currentPlayer + "'s turn";

    }


    function restartGame() {

        board = [
            "", "", "",
            "", "", "",
            "", "", ""
        ];


        currentPlayer = "X";

        gameRunning = true;


        document.getElementById("status")
            .textContent = "Player X's turn";


        document.querySelectorAll(".cell")
            .forEach(function(cell) {

                cell.textContent = "";

            });

    }

</script>


</body>

</html>
